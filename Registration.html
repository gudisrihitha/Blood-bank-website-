<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registration - LifeLink</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


<nav>

    <a href="index.html" class="logo">
         LifeLink Blood Bank
    </a>

    <ul>

        <li><a href="index.html">Home</a></li>

        <li><a href="about.html">About Us</a></li>

        <li><a href="services.html">Services</a></li>

        <li><a href="gallery.html">Gallery</a></li>

        <li><a href="contact.html">Contact</a></li>

    </ul>

</nav>



<div class="page-banner">

    <h1>Donor Registration</h1>

    <p>
        Register and become a blood donor
    </p>

</div>



<section>


    <div class="form-container">


        <div class="form-box">


            <h2>
                Registration Form
            </h2>


            <form
                onsubmit="registerUser(event)"
            >


                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    placeholder="Enter full name"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    placeholder="Enter email"
                    required
                >


                <label>
                    Phone Number
                </label>

                <input
                    type="tel"
                    placeholder="Enter phone number"
                    required
                >


                <label>
                    Age
                </label>

                <input
                    type="number"
                    placeholder="Enter age"
                    min="18"
                    max="65"
                    required
                >


                <label>
                    Blood Group
                </label>

                <select required>

                    <option value="">
                        Select Blood Group
                    </option>

                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                    <option>O+</option>
                    <option>O-</option>

                </select>


                <label>
                    Address
                </label>

                <textarea
                    placeholder="Enter address"
                    required>
                </textarea>


                <label>
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Create password"
                    required
                >


                <button
                    type="submit"
                    class="btn">

                    Register

                </button>


            </form>


        </div>


    </div>


</section>



<script>

function registerUser(event) {

    event.preventDefault();

    alert(
        "Registration Successful! Please login."
    );

    window.location.href = "login.html";

}

</script>



<footer>

    © 2026 LifeLink Blood Bank Management System

</footer>


</body>

</html>
